hotkey = "!v"
runtime_mode = "fast"
paste_format = "plain"
path_style = "plain"

# 输入法保护策略（仅 runtime_mode = "safe" 时生效）
#   off          = 完全不干预输入法
#   imm          = 仅关闭前台窗口 IME 输入状态（默认，不会新增键盘布局）
#   layout       = 切英文键盘布局，但只复用系统里已安装的布局
#   layout-force = 找不到英文布局时才加载 ENG，退出时自动卸载
ime_protection = "imm"

# 远程粘贴（SSH，issue #11）：在终端里 ssh 到远程机器跑 Codex / Claude Code 时，
# 热键会自动识别当前打开的 ssh 会话，把图片上传到远程后粘贴远程路径，无需配置目标。
# 只看你正在粘贴的那个终端 tab：本地 tab 里按热键仍粘贴本地 /mnt 路径。
# 密码与密钥登录均可：优先自动认证，需要时弹窗；后续复用上传连接，密码不落盘。
# true = 自动（默认）；false = 关闭，始终粘贴本地 /mnt 路径。也可在托盘菜单切换
remote_paste = true
