[package]
name = "wsl_clipboard"
version = "4.2.1"
edition = "2021"
description = "WSL CLI Clipboard Helper - Fast image paste for AI agents"
authors = ["liu"]
build = "build.rs"

[dependencies]
# Windows 本地库 - 使用完整 features 以避免导入问题
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_Pointer",
    # 远程粘贴：枚举 ssh.exe 进程并读取其命令行（issue #11）
    "Win32_System_Diagnostics_ToolHelp",
    "Wdk_System_Threading",
    # 判断 ssh 会话是否在前台终端 tab 里：AttachConsole / 控制台标题、读 wsl.exe 的环境块
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    # 单实例：CreateMutexW（参数含 SECURITY_ATTRIBUTES）
    "Win32_Security",
    "Win32_Security_Credentials",
] }

# 全局热键
global-hotkey = "0.5"

# 异步运行时
tokio = { version = "1.38", features = ["full"] }

# 配置管理
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"
zeroize = "1.8"

# 图片处理 (可选)
image = { version = "0.24", optional = true }
png = "0.17"

# 时间处理
chrono = "0.4"

# 日志
tracing = "0.1"
tracing-subscriber = "0.3"

# winresource 仅在 Windows 宿主上真正编译资源（见 build.rs），
# 放在通用 build-dependencies 里以支持从非 Windows 宿主交叉 cargo check
[build-dependencies]
winresource = "0.1"

[features]
default = ["image-support"]
image-support = ["dep:image"]

[[test]]
name = "ssh_integration"
path = "tests/ssh_integration.rs"
harness = false

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3

[profile.release.package."*"]
opt-level = 3
